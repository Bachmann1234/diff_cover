[project]
name = "diff_cover"
version = "10.5.1"
description = "Run coverage and linting reports on diffs"
authors = [{ name = "See Contributors" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.rst"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "Pygments>=2.19.1,<3",
    "Jinja2>=2.7.1",
    "pluggy>=0.13.1,<2",
    "chardet>=3.0.0",
    "tomli>=1.2.1; python_version < '3.11'",
]

[project.optional-dependencies]
toml = []

[project.urls]
Homepage = "https://github.com/Bachmann1234/diff-cover"
Repository = "https://github.com/Bachmann1234/diff-cover"

[project.scripts]
diff-cover = "diff_cover.diff_cover_tool:main"
diff-quality = "diff_cover.diff_quality_tool:main"

[dependency-groups]
dev = [
    "pytest-cov>=6.1.1,<8.0.0",
    "pytest-datadir>=1.5.0,<2",
    "pytest-mock>=3.14.0,<4",
    "pytest-xdist>=3.6.1,<4",
    "pycodestyle>=2.9.1",
    "flake8>=7.0.0",
    "pyflakes>=3.3.2,<4",
    "pylint>=3.3.4,<5.0.0",
    "pydocstyle>=6.1.1,<7",
    "doc8==2.0.0",
    "ruff>=0.11.10,<0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["diff_cover"]

[tool.hatch.build.targets.sdist]
include = ["diff_cover", "tests", "README.rst"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    ".venv",
    "tests/fixtures",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "PLC",  # pylint conventions
    "PLE",  # pylint errors
    "PLR",  # pylint refactoring
    "PLW",  # pylint warnings
]
ignore = [
    "E501",     # line too long (handled by formatter, ignored for multiline docstrings/strings)
    "PLR0904",  # too-many-public-methods
    "PLR0911",  # too-many-return-statements
    "PLR0912",  # too-many-branches
    "PLR0913",  # too-many-arguments
    "PLR0914",  # too-many-locals
    "PLR0915",  # too-many-statements
    "PLR0916",  # too-many-boolean-expressions
    "PLR0917",  # too-many-positional-arguments
    "PLR1702",  # too-many-nested-blocks
    "PLR2004",  # magic-value-comparison
    "PLC0415",  # import-outside-top-level
    "PLW2901",  # redefined-loop-name
]

[tool.ruff.lint.isort]
known-first-party = ["diff_cover"]

[tool.coverage.run]
branch = true
relative_files = true
parallel = true
concurrency = ["multiprocessing"]
source = ["diff_cover"]
omit = ["./tests/*"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if typing.TYPE_CHECKING:",
    "if TYPE_CHECKING:",
    "if __name__ == \"__main__\":",
    "raise NotImplementedError",
    "raise AssertionError",
    "^\\s*pass\\s*$",
]

[tool.coverage.html]
show_contexts = true
skip_covered = false

[tool.pytest.ini_options]
addopts = "--strict-markers"
xfail_strict = true
markers = [
    "disable_all_files_exist: disables the fixture patch_so_all_files_exist",
]

[tool.doc8]
max_line_length = 120
